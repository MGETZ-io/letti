<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lettiskram | Offizielle Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-white: #FFFFFF;
            --neon-pink: #FF007F;
            --dark-bg: #5A0032;
            --mid-pink: #D1208A;
            --black: #000000;
            --twitch-purple: #9146FF;
        }

        * { box-sizing: border-box; font-family: 'Arial Black', sans-serif; }

        body {
            margin: 0;
            background-color: var(--black);
            color: var(--neon-white);
            line-height: 1.2;
        }

        .navbar {
            height: 75px;
            background: var(--black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            border-bottom: 6px solid var(--neon-pink);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand { font-size: 1.6rem; letter-spacing: -1px; text-transform: uppercase; }
        .brand span { color: var(--neon-pink); }

        .hero {
            width: 100%;
            height: 300px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(90,0,50,0.5)), 
                        url('https://www.ledr.com/colours/black.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .satz-1 { color: var(--neon-white); text-shadow: 4px 4px 0px var(--neon-pink); font-size: clamp(1.5rem, 6vw, 2.5rem); }
        .satz-2 { color: var(--neon-pink); text-shadow: 4px 4px 0px var(--neon-white); font-size: clamp(1.5rem, 6vw, 2.5rem); }

        .stream-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 5%;
        }

        .twitch-embed-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border: 4px solid var(--twitch-purple);
            box-shadow: 0 0 15px var(--twitch-purple);
        }

        .twitch-embed-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .live-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #111;
            border-bottom: 4px solid var(--twitch-purple);
            padding: 15px;
            text-align: center;
        }

        .stat-value { font-size: 2rem; color: var(--neon-white); display: block; }
        .stat-label { font-size: 0.7rem; color: var(--twitch-purple); text-transform: uppercase; }

        .main-content {
            padding: 40px 5%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .tile-tiktok, .tile-download {
            background: #111;
            border: 2px solid var(--mid-pink);
            padding: 20px;
        }

        .category { color: var(--neon-pink); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 10px; }
        .title { font-size: 1.8rem; text-transform: uppercase; margin-bottom: 20px; }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            text-align: center;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }

        .btn-outline { border: 2px solid var(--neon-white); color: white; background: transparent; }
        .btn-pink { background: var(--neon-pink); color: white; }

        footer { text-align: center; padding: 60px; opacity: 0.4; font-size: 0.7rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">LETTI<span>KRAM</span></div>
        <div class="nav-social">
            <a href="https://www.twitch.tv/lettiskram" target="_blank" style="color:white; margin-right: 15px;"><i class="fab fa-twitch fa-lg"></i></a>
            <a href="https://www.tiktok.com/@lettiskram" target="_blank" style="color:white;"><i class="fab fa-tiktok fa-lg"></i></a>
        </div>
    </nav>

    <header class="hero">
        <h1>
            <span class="satz-1">LETTI IST</span><br>
            <span class="satz-2">JETZT LIVE?</span>
        </h1>
    </header>

    <div class="stream-container">
        <div class="live-stats">
            <div class="stat-card">
                <span class="stat-value" id="follower-count">Check Twitch</span>
                <span class="stat-label">Follower</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="sub-count">LIVE</span>
                <span class="stat-label">Status</span>
            </div>
        </div>

        <div class="twitch-embed-wrapper">
            <iframe
                src="https://player.twitch.tv/?channel=lettiskram&parent=lettiskram.hustensaft.org"
                frameborder="0"
                allowfullscreen="true"
                scrolling="no">
            </iframe>
        </div>
    </div>

    <div class="main-content">
        <div class="tile-tiktok">
            <div class="category">TikTok Highlights</div>
            <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@lettiskram" data-unique-id="lettiskram" data-embed-type="creator" style="max-width: 780px;"> 
                <section> <a target="_blank" href="https://www.tiktok.com/@lettiskram">@lettiskram</a> </section> 
            </blockquote> 
            <script async src="https://www.tiktok.com/embed.js"></script>
        </div>

        <div class="tile-download">
            <div class="category">Downloads</div>
            <div class="title">Budget-Planung</div>
            <p style="font-family: Arial; font-size: 0.9rem;">Hol dir Lettis exklusive Budgetplanung als PDF!</p>
            <a href="Budgetplanung (A4).pdf" download class="btn btn-pink">Download Starten</a>
            <a href="https://www.twitch.tv/subs/lettiskram" class="btn btn-outline" style="margin-top: 20px; border-color: #9146FF; color: #9146FF;">Letti unterstützen</a>
        </div>
    </div>

    <footer>
       DESIGNED AND CODED BY Hustensaft
    </footer>

</body>
</html>
